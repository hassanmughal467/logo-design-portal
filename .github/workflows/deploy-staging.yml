name: Staging — Build and publish deploy artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - staging-environment

permissions:
  contents: read

jobs:
  build-staging-artifacts:
    name: Build API + Frontend (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Restore & test (staging gate)
        working-directory: Backend
        run: |
          dotnet restore LogoDesignPortal.sln
          dotnet test src/LogoDesignPortal.API.IntegrationTests/LogoDesignPortal.API.IntegrationTests.csproj -c Release \
            --filter "FullyQualifiedName~CsrfCookieAuth|FullyQualifiedName~CorsAllowedOrigins|FullyQualifiedName~ProductionConfiguration|FullyQualifiedName~EnvironmentAppSettings" \
            --verbosity minimal

      - name: Publish API (Release, Staging environment)
        run: |
          dotnet publish "Backend/src/LogoDesignPortal.API/LogoDesignPortal.API.csproj" \
            -c Release \
            -o "${{ runner.temp }}/publish-staging-api" \
            --no-self-contained
          cp "Backend/src/LogoDesignPortal.API/web.config.staging.example.xml" \
            "${{ runner.temp }}/publish-staging-api/web.config.staging.example.xml"

      - name: Build Angular (staging)
        working-directory: Frontend
        run: |
          npm ci
          npm run build:staging

      - name: Package API artifact
        run: |
          cd "${{ runner.temp }}/publish-staging-api"
          zip -r "${{ runner.temp }}/LogoDesignPortal-API-Staging.zip" .

      - name: Package Frontend artifact
        run: |
          DIST="${{ github.workspace }}/Frontend/dist/logo-design-portal-frontend"
          cp "${{ github.workspace }}/Frontend/web.config" "$DIST/"
          cd "$DIST"
          zip -r "${{ runner.temp }}/LogoDesignPortal-Frontend-Staging.zip" .

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogoDesignPortal-API-Staging
          path: ${{ runner.temp }}/LogoDesignPortal-API-Staging.zip
          retention-days: 14

      - name: Upload Frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogoDesignPortal-Frontend-Staging
          path: ${{ runner.temp }}/LogoDesignPortal-Frontend-Staging.zip
          retention-days: 14

      - name: Deployment summary
        run: |
          echo "## Staging deploy artifacts (branch: staging-environment)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **LogoDesignPortal-API-Staging** — unzip to IIS API site; set \`ASPNETCORE_ENVIRONMENT=Staging\` and env vars per \`web.config.staging.example.xml\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **LogoDesignPortal-Frontend-Staging** — unzip to \`staging-admin\` site root" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual deploy: \`deploy-to-staging-iis.ps1\` (on-server) or \`ops/deploy.ps1\` (versioned production-style path)." >> "$GITHUB_STEP_SUMMARY"
          echo "Checklist: \`docs/STAGING_DEPLOYMENT_CHECKLIST.md\` · Post-deploy: \`docs/POST_DEPLOY_VALIDATION.md\`" >> "$GITHUB_STEP_SUMMARY"
