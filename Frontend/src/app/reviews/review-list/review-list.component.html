<div class="reviews-page">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Reviews & Feedback</h1>
      <p class="page-subtitle">Client reviews and designer ratings</p>
    </div>
  </div>

  <p-card styleClass="reviews-card">
    <p-table 
      [value]="reviews" 
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      (onPage)="first = $event.first"
      [globalFilterFields]="['clientName', 'comment']"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-striped">
      
      <ng-template pTemplate="caption">
        <div class="table-header">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input 
              type="text" 
              pInputText 
              [(ngModel)]="globalFilter" 
              placeholder="Search reviews..." 
              class="search-input" />
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th>Client</th>
          <th>Designer</th>
          <th>Rating</th>
          <th>Comment</th>
          <th pSortableColumn="createdAt">
            Date <p-sortIcon field="createdAt"></p-sortIcon>
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-review>
        <tr>
          <td>{{ review.clientName }}</td>
          <td>{{ review.designerName || 'N/A' }}</td>
          <td>
            <div class="rating-stars">
              <i 
                *ngFor="let filled of getRatingStars(review.rating)" 
                [class]="filled ? 'pi pi-star-fill star-filled' : 'pi pi-star star-empty'">
              </i>
              <span class="rating-value">({{ review.rating }}/5)</span>
            </div>
          </td>
          <td>
            <span class="review-comment">{{ review.comment }}</span>
          </td>
          <td>{{ formatDate(review.createdAt) }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty-message">
            <div class="empty-state">
              <i class="pi pi-star empty-icon"></i>
              <p>No reviews found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
