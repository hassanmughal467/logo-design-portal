<div class="files-page">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Files Management</h1>
      <p class="page-subtitle">Upload, view, and manage files</p>
    </div>
  </div>

  <p-card styleClass="files-card">
    <p-table 
      [value]="files" 
      [loading]="loading"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      (onPage)="first = $event.first"
      [globalFilterFields]="['fileName', 'fileType']"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-striped"
      [responsive]="true">
      
      <ng-template pTemplate="caption">
        <div class="table-header">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input 
              type="text" 
              pInputText 
              [(ngModel)]="globalFilter" 
              placeholder="Search files..." 
              class="search-input" />
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th>File Name</th>
          <th>Type</th>
          <th>Size</th>
          <th>Uploaded By</th>
          <th>Uploaded At</th>
          <th>Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-file>
        <tr>
          <td>
            <div class="file-name-cell">
              <i class="pi pi-file"></i>
              <span>{{ file.fileName }}</span>
            </div>
          </td>
          <td>
            <p-tag 
              [value]="file.fileType" 
              severity="info"
              [rounded]="true">
            </p-tag>
          </td>
          <td>{{ formatFileSize(file.fileSize) }}</td>
          <td>{{ file.uploadedBy }}</td>
          <td>{{ formatDate(file.uploadedAt) }}</td>
          <td>
            <div class="action-buttons">
              <p-button 
                icon="pi pi-download" 
                styleClass="p-button-text p-button-rounded p-button-sm"
                (onClick)="downloadFile(file.id, file.fileName)"
                pTooltip="Download"
                tooltipPosition="top">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="empty-message">
            <div class="empty-state">
              <i class="pi pi-file empty-icon"></i>
              <p>No files found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
