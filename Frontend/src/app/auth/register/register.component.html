<div class="register-container">
  <h2>Register</h2>
  <p class="subtitle">Create a new client account</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input 
          pInputText 
          id="firstName" 
          formControlName="firstName" 
          placeholder="First Name"
          [class.ng-invalid]="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
        <small class="p-error" *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
          First name is required
        </small>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input 
          pInputText 
          id="lastName" 
          formControlName="lastName" 
          placeholder="Last Name"
          [class.ng-invalid]="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
        <small class="p-error" *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
          Last name is required
        </small>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input 
        pInputText 
        id="email" 
        formControlName="email" 
        type="email" 
        placeholder="Enter your email"
        [class.ng-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      <small class="p-error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        Valid email is required
      </small>
    </div>

    <div class="form-group">
      <label for="companyName">Company Name</label>
      <input 
        pInputText 
        id="companyName" 
        formControlName="companyName" 
        placeholder="Company Name"
        [class.ng-invalid]="registerForm.get('companyName')?.invalid && registerForm.get('companyName')?.touched">
      <small class="p-error" *ngIf="registerForm.get('companyName')?.invalid && registerForm.get('companyName')?.touched">
        Company name is required
      </small>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Phone Number</label>
      <input 
        pInputText 
        id="phoneNumber" 
        formControlName="phoneNumber" 
        placeholder="Phone Number"
        [class.ng-invalid]="registerForm.get('phoneNumber')?.invalid && registerForm.get('phoneNumber')?.touched">
      <small class="p-error" *ngIf="registerForm.get('phoneNumber')?.invalid && registerForm.get('phoneNumber')?.touched">
        Phone number is required
      </small>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input 
        pInputText 
        id="password" 
        formControlName="password" 
        type="password" 
        placeholder="Enter your password"
        [class.ng-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      <small class="p-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        Password is required (min 6 characters)
      </small>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input 
        pInputText 
        id="confirmPassword" 
        formControlName="confirmPassword" 
        type="password" 
        placeholder="Confirm your password"
        [class.ng-invalid]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
      <small class="p-error" *ngIf="registerForm.get('confirmPassword')?.errors?.['passwordMismatch'] && registerForm.get('confirmPassword')?.touched">
        Passwords do not match
      </small>
    </div>

    <button 
      pButton 
      type="submit" 
      label="Register" 
      [loading]="loading"
      [disabled]="registerForm.invalid"
      class="p-button-primary w-100">
    </button>
  </form>

  <div class="auth-footer">
    <p>Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
