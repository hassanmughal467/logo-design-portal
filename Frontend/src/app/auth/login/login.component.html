<div class="login-container">
  <h2>Login</h2>
  <p class="subtitle">Sign in to your account</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        pInputText 
        id="email" 
        formControlName="email" 
        type="email" 
        placeholder="Enter your email"
        [class.ng-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
      <small class="p-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        Valid email is required
      </small>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <p-password 
        id="password" 
        formControlName="password" 
        placeholder="Enter your password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-100"
        [inputStyleClass]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched ? 'ng-invalid' : ''">
      </p-password>
      <small class="p-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Password is required (min 6 characters)
      </small>
    </div>

    <button 
      pButton 
      type="submit" 
      label="Login" 
      [loading]="loading"
      [disabled]="loginForm.invalid"
      class="p-button-primary w-100">
    </button>
  </form>

  <div class="auth-footer">
    <p>Don't have an account? <a routerLink="/register">Register here</a></p>
  </div>
</div>
