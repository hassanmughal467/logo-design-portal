<div class="reset-password-container">
  <h2>Reset Password</h2>
  <p class="subtitle">Enter your new password</p>

  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <p-password 
        id="newPassword" 
        formControlName="newPassword" 
        placeholder="Enter new password"
        [toggleMask]="true"
        [feedback]="true"
        styleClass="w-100"
        [inputStyleClass]="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched ? 'ng-invalid' : ''">
      </p-password>
      <small class="p-error" *ngIf="resetPasswordForm.get('newPassword')?.hasError('required') && resetPasswordForm.get('newPassword')?.touched">
        New password is required
      </small>
      <small class="p-error" *ngIf="resetPasswordForm.get('newPassword')?.hasError('minlength') && resetPasswordForm.get('newPassword')?.touched && !resetPasswordForm.get('newPassword')?.hasError('required')">
        Password must be at least 8 characters
      </small>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <p-password 
        id="confirmPassword" 
        formControlName="confirmPassword" 
        placeholder="Confirm new password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-100"
        [inputStyleClass]="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched ? 'ng-invalid' : ''">
      </p-password>
      <small class="p-error" *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('required') && resetPasswordForm.get('confirmPassword')?.touched">
        Please confirm your password
      </small>
      <small class="p-error" *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.touched && !resetPasswordForm.get('confirmPassword')?.hasError('required')">
        Passwords do not match
      </small>
    </div>

    <button 
      pButton 
      type="submit" 
      label="Reset Password" 
      [loading]="loading"
      [disabled]="loading"
      class="p-button-primary w-100">
    </button>
  </form>

  <div class="auth-footer">
    <p><a routerLink="/login">Back to Login</a></p>
  </div>
</div>
