<div class="activity-feed-card">
  <h3 class="chart-title"><i class="pi pi-list"></i> Financial Activity Feed</h3>
  <div *ngIf="loading" class="feed-skeleton">
    <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>
  <div *ngIf="!loading && items?.length" class="feed-list">
    <div class="feed-item" *ngFor="let item of items">
      <div class="feed-icon" [class]="'severity-' + getSeverity(item.type)">
        <i [class]="getIcon(item.type)"></i>
      </div>
      <div class="feed-content">
        <span class="feed-desc">{{ item.description }}</span>
        <span class="feed-meta">
          <span *ngIf="item.amount != null" class="feed-amount">{{ formatCurrency(item.amount) }}</span>
          <span class="feed-time">{{ formatDate(item.occurredAt) }}</span>
        </span>
      </div>
    </div>
  </div>
  <div *ngIf="!loading && (!items || items.length === 0)" class="chart-empty">
    <i class="pi pi-inbox"></i>
    <p>No recent activity</p>
  </div>
</div>
