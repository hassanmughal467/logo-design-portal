<div class="permissions-page">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Permissions Management</h1>
      <p class="page-subtitle">Manage role permissions and access control</p>
    </div>
    <div class="header-actions">
      <p-button 
        label="Permission Matrix" 
        icon="pi pi-table" 
        (onClick)="toggleMatrixView()"
        styleClass="p-button-secondary">
      </p-button>
    </div>
  </div>

  <p-card styleClass="permissions-card">
    <p-table 
      [value]="permissions" 
      [loading]="loading"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      (onPage)="first = $event.first"
      [globalFilterFields]="['name', 'description', 'resource', 'action']"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-striped"
      [responsive]="true">
      
      <ng-template pTemplate="caption">
        <div class="table-header">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input 
              type="text" 
              pInputText 
              [(ngModel)]="globalFilter" 
              placeholder="Search permissions..." 
              class="search-input" />
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th>Permission Name</th>
          <th>Description</th>
          <th>Resource</th>
          <th>Action</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-permission>
        <tr>
          <td>
            <div class="permission-name-cell">
              <i class="pi pi-key"></i>
              <span>{{ permission.name }}</span>
            </div>
          </td>
          <td>{{ permission.description }}</td>
          <td>
            <p-tag 
              [value]="permission.resource" 
              severity="info"
              [rounded]="true">
            </p-tag>
          </td>
          <td>
            <p-tag 
              [value]="permission.action" 
              severity="success"
              [rounded]="true">
            </p-tag>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="empty-message">
            <div class="empty-state">
              <i class="pi pi-key empty-icon"></i>
              <p>No permissions found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
