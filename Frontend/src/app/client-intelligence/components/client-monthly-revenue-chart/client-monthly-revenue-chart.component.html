<div class="client-monthly-revenue-chart">
  <p-progressSpinner *ngIf="loading" strokeWidth="4" [style]="{width: '40px', height: '40px'}"></p-progressSpinner>
  <apx-chart *ngIf="chartOptions && !loading" [series]="chartOptions.series" [chart]="chartOptions.chart"
    [plotOptions]="chartOptions.plotOptions" [colors]="chartOptions.colors"
    [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
    [tooltip]="chartOptions.tooltip" [dataLabels]="chartOptions.dataLabels">
  </apx-chart>
  <div *ngIf="!items?.length && !loading" class="empty-state">
    <i class="pi pi-user"></i>
    <p>Select a client to view monthly revenue</p>
  </div>
</div>
