<div class="client-monthly-revenue-chart">
  <div *ngIf="loading" class="chart-loading">
    <p-progressSpinner strokeWidth="4"></p-progressSpinner>
  </div>
  <apx-chart *ngIf="!loading && chartOptions" [series]="chartOptions.series" [chart]="chartOptions.chart"
    [plotOptions]="chartOptions.plotOptions" [colors]="chartOptions.colors"
    [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
    [tooltip]="chartOptions.tooltip" [dataLabels]="chartOptions.dataLabels">
  </apx-chart>
  <div *ngIf="!loading && !items?.length" class="empty-state">
    <i class="pi pi-user"></i>
    <p>Select a client to view monthly revenue</p>
  </div>
</div>
