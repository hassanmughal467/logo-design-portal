<div class="client-growth-chart">
  <apx-chart *ngIf="chartOptions" [series]="chartOptions.series" [chart]="chartOptions.chart"
    [plotOptions]="chartOptions.plotOptions" [colors]="chartOptions.colors"
    [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
    [tooltip]="chartOptions.tooltip" [dataLabels]="chartOptions.dataLabels">
  </apx-chart>
  <div *ngIf="!items?.length" class="empty-state">
    <i class="pi pi-chart-bar"></i>
    <p>No growth data available</p>
  </div>
</div>
