<div class="inactive-clients-table">
  <p-table [value]="items" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 25]"
    styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="clientName">Client Name <p-sortIcon field="clientName"></p-sortIcon></th>
        <th pSortableColumn="lastOrderDate">Last Order Date <p-sortIcon field="lastOrderDate"></p-sortIcon></th>
        <th pSortableColumn="daysSinceLastOrder">Days Since Last Order <p-sortIcon field="daysSinceLastOrder"></p-sortIcon></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.clientName || 'Unknown' }}</td>
        <td>{{ formatDate(item.lastOrderDate) }}</td>
        <td>
          <span class="days-badge" [class.high]="item.daysSinceLastOrder >= 60">
            {{ item.daysSinceLastOrder }} days
          </span>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty-message">
          <i class="pi pi-check-circle"></i>
          <p>No inactive clients found. All clients have ordered within the last 30 days.</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
